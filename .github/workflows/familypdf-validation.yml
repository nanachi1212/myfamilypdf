name: FamilyPDF validation

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-runtime:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FAMILYPDF_TOOLS_ROOT: ${{ github.workspace }}\build-tools
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      FAMILYPDF_TEST_ARTIFACT_DIR: ${{ github.workspace }}\build\test-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned Qt and vcpkg toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}\build-tools
            ${{ github.workspace }}\vcpkg-binary-cache
          key: windows-family-pdf-tools-v3-${{ hashFiles('scripts/phase0/install-build-toolchain.ps1', 'vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            windows-family-pdf-tools-v3-

      - name: Restore incremental C++ build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/phase0-upstream-release
          key: windows-family-pdf-build-v1-${{ github.sha }}
          restore-keys: |
            windows-family-pdf-build-v1-

      - name: Configure, build and run C++ tests
        shell: powershell
        run: .\scripts\phase0\build-upstream-baseline.ps1 -Stage All

      - name: Launch Viewer and open generated PDF
        if: success()
        shell: powershell
        run: |
          .\scripts\qa\smoke-viewer.ps1 `
            -RuntimeDirectory .\build\phase0-upstream-release\usr\bin `
            -PdfFile .\build\test-artifacts\viewer-smoke.pdf `
            -OutputDirectory .\build\test-artifacts\viewer-process

      - name: Save toolchain cache after build or test failure
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}\build-tools
            ${{ github.workspace }}\vcpkg-binary-cache
          key: windows-family-pdf-tools-v3-${{ hashFiles('scripts/phase0/install-build-toolchain.ps1', 'vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Save incremental C++ build after test failure
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/phase0-upstream-release
          key: windows-family-pdf-build-v1-${{ github.sha }}

      - name: Upload runtime validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-runtime-validation
          path: |
            build/phase0-upstream-release/*.log
            build/phase0-upstream-release/phase0-build-metrics.json
            build/phase0-upstream-release/Testing/Temporary/*.log
            build/test-artifacts
          if-no-files-found: warn
          retention-days: 14

  powershell-and-ocr-metadata:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | ForEach-Object {
            $errors = $null
            $tokens = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) {
            throw 'One or more PowerShell scripts could not be parsed.'
          }

      - name: Run Office Export Python tests
        shell: powershell
        working-directory: office-export
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m unittest discover -s tests -v

      - name: Verify pinned OCR language manifest
        shell: powershell
        run: .\scripts\ocr\Test-OCR-Language-Manifest.ps1

      - name: Verify release metadata consistency
        shell: powershell
        run: .\scripts\qa\test-release-metadata.ps1

      - name: Verify toolchain path portability
        shell: powershell
        run: .\scripts\qa\test-toolchain-paths.ps1

      - name: Verify bounded external process execution
        shell: powershell
        run: .\scripts\qa\test-external-process-contracts.ps1

      - name: Verify strict AES malformed-input handling
        shell: powershell
        run: .\scripts\qa\test-aes-security-contract.ps1

      - name: Verify atomic output and TTS null-safety contracts
        shell: powershell
        run: .\scripts\qa\test-atomic-output-contracts.ps1

      - name: Verify Qt test platform contract
        shell: powershell
        run: .\scripts\qa\test-qt-test-platform-contract.ps1

      - name: Verify POSIX atomic replacement contracts
        shell: powershell
        run: .\scripts\qa\test-posix-atomic-replacement-contract.ps1

      - name: Verify installer in-place upgrade contract
        shell: powershell
        run: .\scripts\qa\test-installer-upgrade-contract.ps1

      - name: Verify branding without settings identity drift
        shell: powershell
        run: .\scripts\qa\test-branding-contract.ps1

      - name: Verify cross-platform packaging branding and versions
        shell: powershell
        run: .\scripts\qa\test-cross-platform-branding-contract.ps1

      - name: Verify OCR download hash enforcement and cleanup
        shell: powershell
        run: .\scripts\ocr\Test-OCR-Language-Download.ps1
