name: FamilyPDF validation

on:
  push:
    branches:
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-and-ocr-metadata:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | ForEach-Object {
            $errors = $null
            $tokens = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) {
            throw 'One or more PowerShell scripts could not be parsed.'
          }

      - name: Verify pinned OCR language manifest
        shell: powershell
        run: .\scripts\ocr\Test-OCR-Language-Manifest.ps1

      - name: Verify OCR download hash enforcement and cleanup
        shell: powershell
        run: .\scripts\ocr\Test-OCR-Language-Download.ps1
