name: FamilyPDF validation

on:
  push:
    branches:
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-and-ocr-metadata:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | ForEach-Object {
            $errors = $null
            $tokens = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) {
            throw 'One or more PowerShell scripts could not be parsed.'
          }

      - name: Run Office Export Python tests
        shell: powershell
        working-directory: office-export
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m unittest discover -s tests -v

      - name: Verify pinned OCR language manifest
        shell: powershell
        run: .\scripts\ocr\Test-OCR-Language-Manifest.ps1

      - name: Verify release metadata consistency
        shell: powershell
        run: .\scripts\qa\test-release-metadata.ps1

      - name: Verify toolchain path portability
        shell: powershell
        run: .\scripts\qa\test-toolchain-paths.ps1

      - name: Verify bounded external process execution
        shell: powershell
        run: .\scripts\qa\test-external-process-contracts.ps1

      - name: Verify atomic output and TTS null-safety contracts
        shell: powershell
        run: .\scripts\qa\test-atomic-output-contracts.ps1

      - name: Verify Qt test platform contract
        shell: powershell
        run: .\scripts\qa\test-qt-test-platform-contract.ps1

      - name: Verify installer in-place upgrade contract
        shell: powershell
        run: .\scripts\qa\test-installer-upgrade-contract.ps1

      - name: Verify branding without settings identity drift
        shell: powershell
        run: .\scripts\qa\test-branding-contract.ps1

      - name: Verify OCR download hash enforcement and cleanup
        shell: powershell
        run: .\scripts\ocr\Test-OCR-Language-Download.ps1
